<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2320">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>여행 일정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <figure class="photo" id="photo" hidden><img id="photo-img" alt=""></figure>
    <p class="dday" id="dday"></p>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <p class="range" id="range"></p>
    <div class="leaves" aria-hidden="true"><span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span></div>
    <svg class="scene" viewBox="0 0 390 72" preserveAspectRatio="none" aria-hidden="true">
      <path class="fuji" d="M150 72 L232 18 Q240 13 248 18 L330 72 Z"/>
      <path class="snow" d="M221 25 L232 18 Q240 13 248 18 L259 25 L251 29 L244 24 L237 30 L229 25 Z"/>
      <g class="torii">
        <rect x="42" y="30" width="62" height="5" rx="2"/>
        <rect x="46" y="38" width="54" height="3.5"/>
        <rect x="52" y="34" width="5" height="38"/>
        <rect x="89" y="34" width="5" height="38"/>
      </g>
      <path class="ground" d="M0 72 L0 64 Q195 52 390 64 L390 72 Z"/>
    </svg>
  </header>

  <nav class="tabs" id="tabs" aria-label="일자 선택"></nav>

  <main>
    <section id="day-view"></section>
    <section id="info-view" hidden>
      <div id="wx-box"></div>
      <div id="fx-box"></div>
      <div id="info-box"></div>
    </section>
    <section id="check-view" hidden></section>
  </main>

  <nav class="bottom-bar" aria-label="메뉴">
    <button data-view="day" class="active"><span>🗓️</span>일정</button>
    <button data-view="info"><span>ℹ️</span>정보</button>
    <button data-view="check"><span>✅</span>준비물</button>
  </nav>

  <script src="itinerary.js"></script>
  <script src="app.js"></script>
</body>
</html>
