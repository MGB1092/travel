<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2320">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>고성 · 진주 여행</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
  <!-- 브라우저 캐시 때문에 새 화면 + 예전 스크립트가 섞이지 않도록 항상 최신 파일을 받음 -->
  <script>window.V = Date.now();</script>
  <script>document.write('<link rel="stylesheet" href="style.css?v=' + V + '">');</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
  <style>
    .hero .back { display: inline-block; margin-bottom: 10px; font-size: 13px; color: #fff8ee; text-decoration: none; opacity: .9; }
    .scene .sea { fill: rgba(255,248,238,.22); }
  </style>
</head>
<body>
  <header class="hero">
    <a class="back" href="home.html">← 여행 목록</a><br>
    <figure class="photo" id="photo" hidden><img id="photo-img" alt=""></figure>
    <p class="dday" id="dday"></p>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <p class="range" id="range"></p>
    <div class="leaves" aria-hidden="true"><span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span></div>
    <svg class="scene" viewBox="0 0 390 72" preserveAspectRatio="none" aria-hidden="true">
      <!-- 남해안 산자락과 바다 -->
      <path class="fuji" d="M0 72 L0 46 Q60 22 120 40 Q170 18 230 36 Q290 14 390 40 L390 72 Z"/>
      <path class="sea" d="M0 60 Q32 54 65 60 T130 60 T195 60 T260 60 T325 60 T390 60 L390 72 L0 72 Z"/>
      <path class="ground" d="M0 72 L0 64 Q195 52 390 64 L390 72 Z"/>
    </svg>
  </header>

  <nav class="tabs" id="tabs" aria-label="일자 선택"></nav>

  <main>
    <section id="day-view"></section>
    <section id="info-view" hidden>
      <div id="summary-box"></div>
      <div id="wx-box"></div>
      <div id="fx-box"></div>
      <div id="info-box"></div>
    </section>
    <section id="check-view" hidden></section>
    <section id="food-view" hidden></section>
  </main>

  <nav class="bottom-bar" aria-label="메뉴">
    <button data-view="day" class="active"><span>🗓️</span>일정</button>
    <button data-view="info"><span>ℹ️</span>정보</button>
    <button data-view="check"><span>✅</span>준비물</button>
    <button data-view="food"><span>🍜</span>음식</button>
    <a class="bar-link" href="home.html"><span>🏠</span>목록</a>
  </nav>

  <script>
    document.write('<script src="goseong-jinju.js?v=' + V + '"><\/script>' +
                   '<script src="app.js?v=' + V + '"><\/script>');
  </script>
</body>
</html>
